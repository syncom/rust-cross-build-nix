# Possibly reproducible build with cross-rs and Nix
name: "Reproducible build with cross-rs"

on:
  push:
    paths-ignore:
    - 'nix-rust-overlay/**'
    branches:
    - 'main'
  pull_request:
    paths-ignore:
    - 'nix-rust-overlay/**'
    branches:
    - 'main'

jobs:
    nix-cross-rs-build:
      name: "r10e cross-rs build"
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest]
      runs-on: ${{ matrix.os }}
      steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cross build artifacts
        run: |
          cd ${{ github.workspace }}
          make cross-rs
